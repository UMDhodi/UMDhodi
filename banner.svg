<svg fill="none" viewBox="0 0 1500 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap');
        .b3-wrap { width:100%; height:500px; background:#0d1117; border-radius:10px; overflow:hidden; position:relative; display:flex; flex-direction:column; justify-content:center; padding:5% 6%; box-sizing:border-box; font-family:'JetBrains Mono', monospace; }
        .b3-scanline { position:absolute; inset:0; background:repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,255,100,0.012) 3px, rgba(0,255,100,0.012) 4px); pointer-events:none; }
        .b3-glow { position:absolute; top:-20%; left:30%; width:40%; height:80%; background:radial-gradient(ellipse, rgba(0,255,100,0.04) 0%, transparent 70%); pointer-events:none; }
        .b3-prompt { font-size:22px; color:#4a9960; margin-bottom:0.6em; }
        .b3-prompt .sym { color:#6ee7a0; }
        .b3-comment { font-size:18px; color:#3a6040; letter-spacing:0.05em; margin-bottom:1.8em; }
        .b3-main { font-size:64px; font-weight:800; color:#e6edf3; line-height:1.2; margin-bottom:0.8em; }
        .b3-main .green { color:#6ee7a0; }
        .b3-main .dim { color:#4a5568; }
        .b3-second { font-size:48px; font-weight:700; color:#6ee7a0; }
        .b3-cursor { display:inline-block; width:24px; height:1.1em; background:#6ee7a0; vertical-align:middle; margin-left:4px; animation:blink 1.1s steps(1) infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
        .b3-meta { position:absolute; bottom:6%; right:6%; font-size:14px; color:#2a3a2a; letter-spacing:0.2em; text-transform:uppercase; }
        .b3-line-num { color:#2a3a2a; margin-right:1.5em; user-select:none; }
        .b3-tag { position:absolute; top:6%; right:6%; font-size:16px; color:#6ee7a0; border:1px solid #1a3a2a; padding:4px 12px; border-radius:3px; letter-spacing:0.15em; }
      </style>
      <div class="b3-wrap">
        <div class="b3-scanline"></div>
        <div class="b3-glow"></div>
        <div class="b3-tag">// real builders</div>
        <div class="b3-prompt"><span class="sym">→</span> git log --author="discipline" --oneline</div>
        <div class="b3-comment">// The vibe-coding hangover is real.</div>
        <div class="b3-main">
          <span class="b3-line-num">01</span>The hangover <span class="dim">is</span> <span class="green">real.</span>
        </div>
        <div class="b3-main">
          <span class="b3-line-num">02</span>Some builders <span class="green">never</span>
        </div>
        <div class="b3-second">
          <span class="b3-line-num">03</span>got drunk on it.<span class="b3-cursor"></span>
        </div>
        <div class="b3-meta">craft · 2026 · shipped</div>
      </div>
    </div>
  </foreignObject>
</svg>
